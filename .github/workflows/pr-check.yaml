name: pr check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gh-pages.yaml と同じロジックで pyproject.toml の uv ピンを読む。
      # ここが落ちたら pin 方式そのものが壊れているので、本番デプロイ前に気付ける。
      - name: Resolve uv version
        id: uv-version
        run: |
          version=$(grep -oP '"uv==\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          if [ -z "$version" ]; then
            echo "::error::could not resolve uv version pin from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      # 本番の gh-pages.yaml は `uv sync` で暗黙の再解決を許すが、
      # PR チェックでは --locked にして pyproject.toml と uv.lock の齟齬を検知する。
      - name: Install the project
        run: uv sync --locked

      # main.py は実処理が __main__ ガード内にあるため、import しても TVer API は叩かない。
      # ワークフロー定義自体の lint。actionlint 本体のバージョンは action 既定の latest に
      # 任せる (ここを固定すると Dependabot が追えないピンになり、黙って腐る)。action 自体は
      # SHA ピンなので供給網は押さえられている。
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # actionlint は式の中身しか検査しない。二重波括弧が一重に潰れると、YAML としても
      # ワークフロー定義としても妥当な「ただの文字列」になり、警告なしで素通りしてしまう
      # (2026-09-04: 実際に 6 リポジトリで Dependabot auto-merge が数日サイレントに壊れた)。
      # 潰れた式を機械的に弾く。シェル変数の展開は波括弧の直後に空白を置かず、変数名に
      # ドットや括弧も含まないため誤検知しない。
      - name: Guard against collapsed expressions
        run: |
          if grep -rnE '\$\{ |\$\{(github|secrets|steps|env|inputs|matrix|needs|runner|job|jobs|vars|strategy|hashFiles)[.(]' .github/workflows/; then
            echo "::error::GitHub Actions の式が波括弧 1 組に潰れている。上記の箇所を二重波括弧に直すこと"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Import check
        run: uv run --no-sync python -c "import main"
